<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Little Sugar Tot Photography: newborn, maternity, sitter, cake smash and family photography by Kay in Victoria, Australia.">
<title>Little Sugar Tot Photography</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a sugar-paper studio album — sticky header, single reading column with photo-tile grids, page footer index of all 30 pages */
:root{
  --paper:#f8f5f8; --paper-2:#efe7ef; --ink:#2d2231; --ink-soft:#6b5d70;
  --berry:#b8557a; --berry-ink:#fff; --mint:#9cc3b8; --line:#ddd1dd;
  --tile-a:#ecd9e3; --tile-b:#d9e8e3; --tile-c:#efe2d6; --tile-d:#dfdcef;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1e1821; --paper-2:#2a222e; --ink:#f1e9f2; --ink-soft:#b9a9bd;
  --berry:#e48aac; --berry-ink:#2a1420; --mint:#7fae9f; --line:#3b3040;
  --tile-a:#3a2b35; --tile-b:#263632; --tile-c:#3a3128; --tile-d:#2e2b3d; color-scheme:dark}
:root[data-theme="dark"]{
  --paper:#1e1821; --paper-2:#2a222e; --ink:#f1e9f2; --ink-soft:#b9a9bd;
  --berry:#e48aac; --berry-ink:#2a1420; --mint:#7fae9f; --line:#3b3040;
  --tile-a:#3a2b35; --tile-b:#263632; --tile-c:#3a3128; --tile-d:#2e2b3d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 17px/1.65 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--berry)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--berry);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2.1rem,5.5vw,3.6rem)}
h2{font-size:clamp(1.5rem,3.4vw,2.1rem)}
h3{font-size:1.25rem}
p{margin:0;max-width:65ch}
.eyebrow{font:500 .78rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--berry)}
.mono{font-family:var(--f-mono)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo b{font:400 1.2rem/1 var(--f-display)}
.logo small{display:block;font:500 .66rem/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.cube{width:30px;height:30px;border-radius:7px;background:var(--berry);position:relative;transform:rotate(-8deg);flex:none}
.cube::after{content:"";position:absolute;inset:6px;border:2px solid var(--paper);border-radius:3px}
nav.main{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
nav.main a{color:var(--ink);text-decoration:none;font-weight:600;font-size:.92rem;padding:8px 12px;border-radius:999px}
nav.main a:hover,nav.main a.on{background:var(--paper-2)}
nav.main a.cta{background:var(--berry);color:var(--berry-ink)}
.menu-btn{display:none;font:600 .9rem var(--f-body);background:var(--paper-2);color:var(--ink);border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
@media (max-width:820px){
  .menu-btn{display:block}
  nav.main{display:none;position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
  nav.main.open{display:flex}
}

/* page */
main{padding-block:40px 64px;display:grid;gap:56px}
.crumb{font:400 .8rem var(--f-mono);color:var(--ink-soft)}
.crumb a{color:var(--ink-soft)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero > div{display:grid;gap:18px;min-width:0}
.lede{font-size:1.15rem;color:var(--ink-soft)}
@media (max-width:760px){.hero{grid-template-columns:1fr}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:999px;border:2px solid var(--berry);color:var(--berry);background:transparent;font-family:var(--f-body);font-size:1rem;cursor:pointer}
.btn.fill{background:var(--berry);color:var(--berry-ink)}
section{display:grid;gap:20px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.grid > *{min-width:0}
.two{display:grid;gap:32px;grid-template-columns:1fr 1fr;align-items:start}
.two > *{min-width:0;display:grid;gap:14px}
@media (max-width:760px){.two{grid-template-columns:1fr}

/* photo placeholder tiles */
.ph{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/5;max-width:100%;background:var(--tile-a);display:flex;align-items:flex-end}
.ph.wide{aspect-ratio:3/2}.ph.sq{aspect-ratio:1}
.ph.b{background:var(--tile-b)}.ph.c{background:var(--tile-c)}.ph.d{background:var(--tile-d)}
.ph svg{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.ph span{position:relative;margin:12px;font:400 .72rem/1.35 var(--f-mono);color:var(--ink-soft);background:var(--paper);padding:5px 9px;border-radius:8px}

.service{display:grid;gap:12px;text-decoration:none;color:var(--ink)}
.service:hover h3{color:var(--berry)}
.service p{color:var(--ink-soft);font-size:.95rem}
.price{font:500 .9rem var(--f-mono);color:var(--berry)}
.panel{background:var(--paper-2);border-radius:22px;padding:28px;display:grid;gap:14px}
.panel ul,.list{margin:0;padding-left:1.2em;display:grid;gap:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:2px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.facts div{background:var(--paper);padding:16px 18px;display:grid;gap:4px}
.facts dt{font:500 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.facts dd{margin:0;font:400 1.15rem var(--f-display)}
.steps{counter-reset:s;display:grid;gap:18px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:14px}
.steps li::before{content:counter(s);font:400 1.1rem var(--f-display);width:40px;height:40px;border-radius:50%;background:var(--mint);color:var(--ink);display:grid;place-items:center}
.steps li div{display:grid;gap:4px;min-width:0}
.steps li p{color:var(--ink-soft)}
details{border-top:1px solid var(--line);padding-block:14px}
details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:700}
details p{margin-top:8px;color:var(--ink-soft)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:460px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.note{font-size:.88rem;color:var(--ink-soft)}
.contact-line{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.contact-line code{font:500 1rem var(--f-mono);user-select:all;background:var(--paper-2);padding:6px 10px;border-radius:8px}
.copy{font:600 .8rem var(--f-body);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:600;font-size:.92rem}
input,select,textarea{font:400 1rem var(--f-body);padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.row2{grid-template-columns:1fr}
#formResult{white-space:pre-wrap;font:400 .9rem/1.5 var(--f-mono);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.band{background:var(--paper-2);border-radius:28px;padding:36px 28px;display:grid;gap:16px;justify-items:start}

footer{border-top:1px solid var(--line);padding-block:40px;background:var(--paper-2)}
.fgrid{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.fgrid h4{margin:0 0 8px;font:500 .72rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.fgrid ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.fgrid a{color:var(--ink);text-decoration:none;font-size:.92rem}
.fgrid a:hover{color:var(--berry)}
.fine{margin-top:28px;font-size:.82rem;color:var(--ink-soft)}
@media (prefers-reduced-motion:no-preference){main{animation:in .35s ease both}@keyframes in{from{transform:translateY(6px)}to{transform:none}}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="logo" href="#home"><span class="cube" aria-hidden="true"></span><span><b>Little Sugar Tot</b><small>Photography · Victoria</small></span></a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="mainNav">Menu</button>
    <nav class="main" id="mainNav">
      <a href="#sessions">Sessions</a>
      <a href="#pricing">Pricing</a>
      <a href="#gallery">Gallery</a>
      <a href="#about">About Kay</a>
      <a href="#faq">FAQ</a>
      <a class="cta" href="#contact">Book</a>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap">
    <div class="fgrid" id="footIndex"></div>
    <p class="fine">Little Sugar Tot Photography · Kay · Victoria, Australia · +61 483 030 000 · littlesugartot@gmail.com</p>
  </div>
</footer>

<script>
const PHONE="+61 483 030 000", EMAIL="littlesugartot@gmail.com";

/* soft decorative motif per tile: sugar cubes / bubbles */
function motif(seed){let s=seed*9301%233280,o="";for(let i=0;i<7;i++){s=(s*9301+49297)%233280;const x=s/233280*100;s=(s*9301+49297)%233280;const y=s/233280*80;s=(s*9301+49297)%233280;const r=4+s/233280*14;
o+=i%2?`<rect x="${x}" y="${y}" width="${r}" height="${r}" rx="${r/4}" fill="none" stroke="currentColor" stroke-width=".6" transform="rotate(${(i*23)%40-20} ${x} ${y})"/>`:`<circle cx="${x}" cy="${y}" r="${r/2}" fill="none" stroke="currentColor" stroke-width=".6"/>`}
return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" style="color:var(--ink-soft)">${o}</svg>`}
let tileN=0;
function ph(label,cls=""){tileN++;const t=["","b","c","d"][tileN%4];return `<div class="ph ${t} ${cls}" role="img" aria-label="Photo placeholder: ${label}">${motif(tileN)}<span>${label}</span></div>`}
const crumb=(...p)=>`<div class="crumb"><a href="#home">Home</a>${p.map(x=>x[1]?` / <a href="#${x[1]}">${x[0]}</a>`:` / ${x[0]}`).join("")}</div>`;
const cta=(t="Ready to save a date?",b="Tell Kay your due date or your little one's age, and she'll come back to you with available dates.")=>`<section class="band"><span class="eyebrow">Bookings</span><h2>${t}</h2><p>${b}</p><div class="btns"><a class="btn fill" href="#contact">Make an enquiry</a><a class="btn" href="#booking">How booking works</a></div></section>`;
const facts=a=>`<dl class="facts">${a.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>`;
const ul=a=>`<ul class="list">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
const steps=a=>`<ol class="steps">${a.map(([h,p])=>`<li><div><h3>${h}</h3><p>${p}</p></div></li>`).join("")}</ol>`;
const qa=a=>`<div>${a.map(([q,x])=>`<details><summary>${q}</summary><p>${x}</p></details>`).join("")}</div>`;
const copyLine=(lbl,val)=>`<div class="contact-line"><strong>${lbl}</strong><code>${val}</code><button class="copy" data-copy="${val}">Copy</button></div>`;

const SERVICES=[
 ["newborn","Newborn","Styled sessions in the first weeks, while babies are sleepy and curly.","From $449"],
 ["maternity","Maternity","Bump portraits, solo or with your partner and children.","Enquire"],
 ["sitter","Sitter milestone","The sitting-up stage, usually around 6 to 9 months.","Enquire"],
 ["cake-smash","Cake smash","First-birthday set, cake and outfit, plus 15 edited images.","$499"],
 ["family","Family","Relaxed portraits of everyone together, siblings and grandparents welcome.","Enquire"],
];
const svcGrid=(skip)=>`<div class="grid">${SERVICES.filter(s=>s[0]!==skip).map(([id,n,d,p])=>`<a class="service" href="#${id}">${ph(n+" session")}<h3>${n}</h3><p>${d}</p><span class="price">${p}</span></a>`).join("")}</div>`;

function servicePage(o){return `${crumb(["Sessions","sessions"],[o.name])}
<div class="hero"><div><span class="eyebrow">${o.eyebrow}</span><h1>${o.title}</h1><p class="lede">${o.lede}</p><div class="btns"><a class="btn fill" href="#contact">Enquire about ${o.name.toLowerCase()}</a>${o.more?`<a class="btn" href="#${o.more[1]}">${o.more[0]}</a>`:""}</div></div>${ph(o.photo)}</div>
${facts(o.facts)}
<section class="two"><div><h2>${o.h2}</h2>${o.body.map(p=>`<p>${p}</p>`).join("")}</div><div class="panel"><h3>${o.listTitle}</h3>${ul(o.list)}</div></section>
<section><h2>From recent ${o.name.toLowerCase()} sessions</h2><div class="grid">${o.shots.map(s=>ph(s,"sq")).join("")}</div><p class="note">Photo placeholders. Swap in images from Kay's portfolio.</p></section>
${cta()}`}

function galleryPage(id,name,shots,intro){return `${crumb(["Gallery","gallery"],[name])}
<section><span class="eyebrow">Gallery</span><h1>${name}</h1><p class="lede">${intro}</p></section>
<div class="grid">${shots.map((s,i)=>ph(s,i%3==0?"":"sq")).join("")}</div>
<p class="note">Photo placeholders. Replace each tile with a finished image.</p>
<section><h2>Other galleries</h2><div class="btns">${[["Newborn","gallery-newborn"],["Maternity","gallery-maternity"],["Cake smash","gallery-cake-smash"],["Family &amp; sitter","gallery-family"]].filter(g=>g[1]!==id).map(g=>`<a class="btn" href="#${g[1]}">${g[0]}</a>`).join("")}</div></section>
${cta()}`}

function areaPage(id,suburb,drive,extra){return `${crumb(["Areas we serve","areas"],[suburb])}
<div class="hero"><div><span class="eyebrow">Serving ${suburb}</span><h1>Newborn &amp; family photography for ${suburb} families</h1><p class="lede">Little Sugar Tot works with families from ${suburb} and across Melbourne's south-east. ${extra}</p><div class="btns"><a class="btn fill" href="#contact">Check dates</a><a class="btn" href="#pricing">See pricing</a></div></div>${ph("Family portrait, "+suburb+" client")}</div>
<section class="two"><div><h2>Sessions for ${suburb} families</h2><p>Every session type is open to ${suburb} families: newborn, maternity, sitter milestone, cake smash and family portraits. ${drive}</p><p>When you enquire, mention you're in ${suburb} and Kay will confirm the session location and any travel details with your booking.</p></div><div class="panel"><h3>Popular with local parents</h3>${ul(["<a href='#newborn'>Newborn sessions</a> from $449","<a href='#cake-smash'>Cake smash</a> at $499 with 15 edited images","<a href='#maternity'>Maternity</a> from around 30–34 weeks","<a href='#family'>Family portraits</a> for every stage"])}</div></section>
<section><h2>Other areas</h2><div class="btns">${[["Cranbourne North","cranbourne-north"],["Cranbourne South","cranbourne-south"],["Pakenham","pakenham"]].filter(a=>a[1]!==id).map(a=>`<a class="btn" href="#${a[1]}">${a[0]}</a>`).join("")}</div></section>
${cta()}`}

const PAGES={
home:{t:"Home",g:"Studio",r:()=>`
<div class="hero"><div><span class="eyebrow">Newborn · Maternity · Sitter · Cake smash · Family</span><h1>Tiny toes, first smiles, and the whole sweet beginning.</h1><p class="lede">Little Sugar Tot is Kay's photography studio in Victoria, Australia. She photographs newborns, bumps, sitters, first birthdays and families across Cranbourne North, Cranbourne South, Pakenham and nearby suburbs.</p><div class="btns"><a class="btn fill" href="#contact">Enquire about a date</a><a class="btn" href="#sessions">Explore sessions</a></div></div>${ph("Newborn curled on a cream wrap, hero image")}</div>
${facts([["Newborn sessions","from $449"],["Cake smash","$499"],["Edited images, cake smash","15"],["Based in","Victoria, AU"]])}
<section><span class="eyebrow">Sessions</span><h2>Photography for every early milestone</h2>${svcGrid()}</section>
<section class="two"><div><span class="eyebrow">Meet Kay</span><h2>One photographer, start to finish</h2><p>Kay plans your styling, runs your session and edits every image herself. Babies set the pace, so sessions include time for feeds, cuddles and settling.</p><a class="btn" href="#about">More about Kay</a></div>${ph("Kay in the studio with a wrapped newborn","wide")}</section>
<section><span class="eyebrow">Planning ahead</span><h2>Booking a newborn session?</h2><p>Enquire during your pregnancy. Kay pencils in your due date, then confirms the exact day once your baby arrives, usually within the first two weeks.</p><div class="btns"><a class="btn" href="#prepare-newborn">Prepare for your newborn session</a><a class="btn" href="#newborn-safety">How Kay keeps babies safe</a></div></section>
${cta()}`},

about:{t:"About Kay",g:"Studio",r:()=>`${crumb(["About Kay"])}
<div class="hero"><div><span class="eyebrow">About</span><h1>Hi, I'm Kay.</h1><p class="lede">I run Little Sugar Tot Photography from Victoria, photographing families as they grow, from the bump to the first birthday cake and beyond.</p></div>${ph("Portrait of Kay with her camera")}</div>
<section class="two"><div><h2>Why "Little Sugar Tot"</h2><p>The first year goes quickly. A newborn's curled-up shape lasts only a couple of weeks, and the wobbly sitting stage is gone in a few months. I started Little Sugar Tot to help parents keep those stages before they pass.</p><p>Every session is planned around your baby. I keep the studio warm, the pace slow and the styling soft, so parents can relax and watch.</p></div><div class="panel"><h3>What you can expect from me</h3>${ul(["One photographer from enquiry to final gallery","Styling, outfits and props chosen with you","Patience for feeds, nappy changes and settling","Hand-edited images, delivered digitally"])}</div></section>
<section><h2>Find me online</h2><p>Recent sessions go up on Instagram and Facebook under <strong>Little Sugar Tot Photography</strong>.</p><div class="btns"><a class="btn" href="#contact">Get in touch</a></div></section>
${cta("Let's plan your session")}`},

sessions:{t:"All sessions",g:"Sessions",r:()=>`${crumb(["Sessions"])}
<section><span class="eyebrow">Sessions</span><h1>Choose your session</h1><p class="lede">Five session types follow your family through the first years. Most families come back for more than one.</p></section>
${svcGrid()}
<section><h2>A typical first year with Little Sugar Tot</h2><div class="table-wrap"><table><thead><tr><th>Stage</th><th>Usual timing</th><th>Session</th></tr></thead><tbody>
<tr><td>Bump</td><td class="n">30–34 weeks</td><td><a href="#maternity">Maternity</a></td></tr>
<tr><td>Newborn</td><td class="n">5–14 days</td><td><a href="#newborn">Newborn</a></td></tr>
<tr><td>Sitting up</td><td class="n">6–9 months</td><td><a href="#sitter">Sitter milestone</a></td></tr>
<tr><td>First birthday</td><td class="n">11–13 months</td><td><a href="#cake-smash">Cake smash</a></td></tr>
<tr><td>Anytime</td><td class="n">Any age</td><td><a href="#family">Family</a></td></tr></tbody></table></div>
<p class="note">Timings are a guide. Every baby develops at their own pace.</p></section>
${cta()}`},

newborn:{t:"Newborn",g:"Sessions",r:()=>servicePage({name:"Newborn",eyebrow:"Newborn sessions · from $449",title:"Styled newborn portraits in the first sleepy weeks",lede:"Wraps, soft textures and simple sets, photographed while your baby is still curled and settled.",photo:"Sleeping newborn in a knitted bonnet",more:["Newborn packages","newborn-packages"],
facts:[["Starting price","$449"],["Best age","5–14 days"],["Allow","3–4 hours"],["Includes","Styling &amp; props"]],
h2:"How a newborn session runs",body:["Sessions are baby-led. Kay begins with your little one fed and drowsy, works through wrapped and posed setups, and pauses whenever baby needs a feed or a cuddle.","Parent and sibling images are added near the end, while baby is still settled. You're welcome to sit back, have a cuppa and watch."],
listTitle:"Included in every newborn session",list:["Studio time in a warm, prepared space","Wraps, bonnets, backdrops and props","Parent and sibling images on request","Professionally edited digital images","Online gallery for viewing and download"],
shots:["Wrapped newborn on a cream bean bag","Tiny feet close-up","Parents' hands around baby","Big sister kissing baby's head"]})},

"newborn-packages":{t:"Newborn packages",g:"Pricing",r:()=>`${crumb(["Pricing","pricing"],["Newborn packages"])}

const ORDER=Object.keys(PAGES);
const GROUPS={};ORDER.forEach(k=>{(GROUPS[PAGES[k].g]=GROUPS[PAGES[k].g]||[]).push(k)});
document.getElementById("footIndex").innerHTML=Object.entries(GROUPS).map(([g,ks])=>`<div><h4>${g}</h4><ul>${ks.map(k=>`<li><a href="#${k}">${PAGES[k].t}</a></li>`).join("")}</ul></div>`).join("");

const app=document.getElementById("app"),nav=document.getElementById("mainNav"),mb=document.getElementById("menuBtn");
function render(){const id=(location.hash||"#home").slice(1);const p=PAGES[id]||PAGES.home;tileN=0;app.innerHTML=p.r();
document.title=(id==="home"||!PAGES[id])?"Little Sugar Tot Photography":p.t+" · Little Sugar Tot";
nav.querySelectorAll("a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+id));
nav.classList.remove("open");mb.setAttribute("aria-expanded","false");window.scrollTo(0,0);bind()}
function copy(text,btn){const done=()=>{const o=btn.textContent;btn.textContent="Copied";setTimeout(()=>btn.textContent=o,1500)};
try{navigator.clipboard.writeText(text).then(done).catch(()=>sel(btn))}catch(e){sel(btn)}}
function sel(btn){const el=btn.previousElementSibling;if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function bind(){app.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copy(b.dataset.copy,b));
const f=document.getElementById("enq");if(!f)return;
f.onsubmit=e=>{e.preventDefault();const v=id=>document.getElementById(id).value.trim();
const msg=`Hi Kay,\n\nI'd like to enquire about a ${v("fSession").toLowerCase()} session.\nName: ${v("fName")||"-"}\nPhone: ${v("fPhone")||"-"}\nDue date / birthday: ${v("fDate")||"-"}\nSuburb: ${v("fSuburb")||"-"}\n\n${v("fMsg")}`;
document.getElementById("formResult").textContent=msg;document.getElementById("formOut").hidden=false;
document.getElementById("copyEnq").onclick=function(){try{navigator.clipboard.writeText(msg).then(()=>this.textContent="Copied").catch(()=>{})}catch(e){}}}}
mb.onclick=()=>{const o=nav.classList.toggle("open");mb.setAttribute("aria-expanded",o)};
addEventListener("hashchange",render);render();
</script>
