<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Little Sugar Tot Photography: timeless maternity, newborn, kids, cake smash and family portraits by Kay in Cranbourne North, Victoria.">
<title>Little Sugar Tot Photography</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a quiet portrait studio — wide white margins, full-bleed photo frames, centred serif headings, hairline rules; photos carry the colour */
:root{
  --paper:#fdfcfa; --paper-2:#f5f1ec; --ink:#2f2a27; --ink-soft:#756b65;
  --berry:#a8786b; --berry-ink:#fdfcfa; --mint:#e9dcd4; --line:#e6ded7;
  --tile-a:#efe8e1; --tile-b:#ebe6e0; --tile-c:#f1e9e3; --tile-d:#e8e3dc;
  --f-display:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --f-body:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  --f-mono:"Jost","Futura","Avenir Next",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1c1917; --paper-2:#26221f; --ink:#f2ece6; --ink-soft:#b3a79f;
  --berry:#d4a698; --berry-ink:#1c1917; --mint:#3a312c; --line:#3a3330;
  --tile-a:#2c2724; --tile-b:#2a2622; --tile-c:#2e2825; --tile-d:#292522; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1c1917; --paper-2:#26221f; --ink:#f2ece6; --ink-soft:#b3a79f;
  --berry:#d4a698; --berry-ink:#1c1917; --mint:#3a312c; --line:#3a3330;
  --tile-a:#2c2724; --tile-b:#2a2622; --tile-c:#2e2825; --tile-d:#292522; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:300 17px/1.75 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--ink);text-decoration-color:var(--berry);text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px solid var(--berry);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.1;text-wrap:balance;margin:0;letter-spacing:.005em}
h1{font-size:clamp(2.4rem,6vw,4.2rem)}
h1 em,h2 em{font-style:italic;color:var(--berry)}
h2{font-size:clamp(1.8rem,3.6vw,2.6rem)}
h3{font-size:1.5rem;font-weight:500}
p{margin:0;max-width:62ch}
strong{font-weight:500}
.eyebrow{font:400 .74rem/1.4 var(--f-body);letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft)}
.mono{font-family:var(--f-display)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px}
.logo{text-decoration:none;color:var(--ink);display:grid;line-height:1}
.logo b{font:italic 400 1.65rem/1 var(--f-display)}
.logo small{font:400 .62rem/1.6 var(--f-body);letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px}
nav.main{display:flex;gap:26px;flex-wrap:wrap;align-items:center}
nav.main a{color:var(--ink);text-decoration:none;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;padding-block:6px;border-bottom:1px solid transparent}
nav.main a:hover,nav.main a.on{border-bottom-color:var(--berry)}
nav.main a.cta{border:1px solid var(--ink);padding:9px 18px}
nav.main a.cta:hover{background:var(--ink);color:var(--paper)}
.menu-btn{display:none;font:400 .74rem var(--f-body);letter-spacing:.2em;text-transform:uppercase;background:none;color:var(--ink);border:1px solid var(--line);padding:9px 14px;cursor:pointer}
@media (max-width:860px){
  .menu-btn{display:block}
  nav.main{display:none;position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start;gap:14px;padding:18px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px))}
  nav.main.open{display:flex}
}

main{padding-block:48px 80px;display:grid;gap:88px}
.crumb{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
.crumb a{color:var(--ink-soft);text-decoration:none}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.hero > div{display:grid;gap:22px;min-width:0}
.lede{font-size:1.12rem;color:var(--ink-soft)}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:32px}.hero .ph{order:-1}}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;text-decoration:none;font:400 .74rem/1 var(--f-body);letter-spacing:.22em;text-transform:uppercase;padding:15px 24px;border:1px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer}
.btn:hover{background:var(--paper-2)}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn.fill:hover{background:var(--berry);border-color:var(--berry)}
section{display:grid;gap:24px}
.grid{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.grid > *{min-width:0}
.two{display:grid;gap:48px;grid-template-columns:1fr 1fr;align-items:start}
.two > *{min-width:0;display:grid;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}

/* photo frames: flat warm-neutral slot, ready for Kay's images */
.ph{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--tile-a);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.ph.wide{aspect-ratio:3/2}.ph.sq{aspect-ratio:1}
.ph.b{background:var(--tile-b)}.ph.c{background:var(--tile-c)}.ph.d{background:var(--tile-d)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph span{position:relative;margin:16px;font:400 .66rem/1.5 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);text-align:center}

.service{display:grid;gap:12px;text-decoration:none;color:var(--ink);text-align:center;justify-items:center}
.service .ph{width:100%}
.service:hover h3{color:var(--berry)}
.service p{color:var(--ink-soft);font-size:.95rem}
.price{font:italic 400 1.15rem var(--f-display);color:var(--berry)}
.panel{background:var(--paper-2);padding:32px;display:grid;gap:14px;align-content:start}
.panel ul,.list{margin:0;padding-left:1.1em;display:grid;gap:8px}
.list li::marker{color:var(--berry)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));border-block:1px solid var(--line)}
.facts div{padding:22px 12px;display:grid;gap:6px;text-align:center}
.facts dt{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}
.facts dd{margin:0;font:400 1.6rem/1.1 var(--f-display)}
.steps{counter-reset:s;display:grid;gap:26px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:52px 1fr;gap:16px;align-items:start}
.steps li::before{content:counter(s,upper-roman);font:italic 400 1.5rem/1 var(--f-display);color:var(--berry);padding-top:4px}
.steps li div{display:grid;gap:6px;min-width:0}
.steps li p{color:var(--ink-soft)}
details{border-top:1px solid var(--line);padding-block:18px}
details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font:400 1.3rem var(--f-display)}
details p{margin-top:10px;color:var(--ink-soft)}
.table-wrap{overflow-x:auto;border-block:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:460px}
th,td{text-align:left;padding:16px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:400;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}
td.n{font:italic 400 1.15rem var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--berry)}
tr:last-child td{border-bottom:0}
.note{font-size:.86rem;color:var(--ink-soft)}
.contact-line{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.contact-line strong{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;font-weight:400;color:var(--ink-soft);min-width:90px}
.contact-line code{font:400 1.25rem var(--f-display);user-select:all}
.copy{font:400 .66rem var(--f-body);letter-spacing:.18em;text-transform:uppercase;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 12px;cursor:pointer}
form{display:grid;gap:16px}
label{display:grid;gap:6px;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
input,select,textarea{font:300 1rem var(--f-body);padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);width:100%;border-radius:0;letter-spacing:0;text-transform:none}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--berry);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
#formResult{white-space:pre-wrap;font:300 .92rem/1.6 var(--f-body);background:var(--paper-2);padding:18px}
.band{border-block:1px solid var(--line);padding-block:56px;display:grid;gap:18px;justify-items:center;text-align:center}
.band p{color:var(--ink-soft)}
.band .btns{justify-content:center}
.intro{text-align:center;justify-items:center}
.intro .lede{margin-inline:auto}
.quote{font:italic 400 clamp(1.5rem,3vw,2.1rem)/1.35 var(--f-display);text-align:center;max-width:30ch;margin-inline:auto;color:var(--ink)}
.cover{aspect-ratio:21/9}
@media (max-width:760px){.cover{aspect-ratio:4/5}}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 40px;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}
.stats b{font:400 1.4rem var(--f-display);letter-spacing:0;color:var(--ink);text-transform:none;margin-right:6px}

footer{border-top:1px solid var(--line);padding-block:56px;background:var(--paper-2)}
.fgrid{display:grid;gap:32px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.fgrid h4{margin:0 0 10px;font-weight:400;font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft)}
.fgrid ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.fgrid a{color:var(--ink);text-decoration:none;font-size:.9rem}
.fgrid a:hover{color:var(--berry)}
.fine{margin-top:36px;font-size:.8rem;color:var(--ink-soft);text-align:center}
@media (prefers-reduced-motion:no-preference){main{animation:in .5s ease both}@keyframes in{from{transform:translateY(8px)}to{transform:none}}}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="logo" href="#home"><b>Little Sugar Tot</b><small>Photography</small></a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="mainNav">Menu</button>
    <nav class="main" id="mainNav">
      <a href="#sessions">Sessions</a>
      <a href="#pricing">Pricing</a>
      <a href="#gallery">Gallery</a>
      <a href="#about">About Kay</a>
      <a href="#faq">FAQ</a>
      <a class="cta" href="#contact">Book</a>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap">
    <div class="fgrid" id="footIndex"></div>
    <p class="fine">Little Sugar Tot Photography · 9 Godwin Crescent, Cranbourne North VIC 3977 · +61 483 030 000 · littlesugartot@gmail.com · @littlesugartotphotography</p>
  </div>
</footer>

<script>
const PHONE="+61 483 030 000", EMAIL="littlesugartot@gmail.com";

let tileN=0;
function ph(label,cls=""){tileN++;const t=["","b","c","d"][tileN%4];return `<div class="ph ${t} ${cls}" role="img" aria-label="${label}"><span>${label}</span></div>`}
const crumb=(...p)=>`<div class="crumb"><a href="#home">Home</a>${p.map(x=>x[1]?` / <a href="#${x[1]}">${x[0]}</a>`:` / ${x[0]}`).join("")}</div>`;
const cta=(t="Ready to save a date?",b="Tell Kay your due date or your little one's age, and she'll come back to you with available dates.")=>`<section class="band"><span class="eyebrow">Bookings</span><h2>${t}</h2><p>${b}</p><div class="btns"><a class="btn fill" href="#contact">Make an enquiry</a><a class="btn" href="#booking">How booking works</a></div></section>`;
const facts=a=>`<dl class="facts">${a.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>`;
const ul=a=>`<ul class="list">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
const steps=a=>`<ol class="steps">${a.map(([h,p])=>`<li><div><h3>${h}</h3><p>${p}</p></div></li>`).join("")}</ol>`;
const qa=a=>`<div>${a.map(([q,x])=>`<details><summary>${q}</summary><p>${x}</p></details>`).join("")}</div>`;
const copyLine=(lbl,val)=>`<div class="contact-line"><strong>${lbl}</strong><code>${val}</code><button class="copy" data-copy="${val}">Copy</button></div>`;

const SERVICES=[
 ["newborn","Newborn","Styled sessions in the first weeks, while babies are sleepy and curly.","From $449"],
 ["maternity","Maternity","Bump portraits, solo or with your partner and children.","Enquire"],
 ["sitter","Sitter milestone","The sitting-up stage, usually around 6 to 9 months.","Enquire"],
 ["cake-smash","Cake smash","First-birthday set, cake and outfit, plus 15 edited images.","$499"],
 ["kids","Kids","Toddler and big-kid portraits, plus seasonal themed minis.","Enquire"],
 ["family","Family","Relaxed portraits of everyone together, siblings and grandparents welcome.","Enquire"],
];
const svcGrid=(skip)=>`<div class="grid">${SERVICES.filter(s=>s[0]!==skip).map(([id,n,d,p])=>`<a class="service" href="#${id}">${ph(n+" session")}<h3>${n}</h3><p>${d}</p><span class="price">${p}</span></a>`).join("")}</div>`;

function servicePage(o){return `${crumb(["Sessions","sessions"],[o.name])}
<div class="hero"><div><span class="eyebrow">${o.eyebrow}</span><h1>${o.title}</h1><p class="lede">${o.lede}</p><div class="btns"><a class="btn fill" href="#contact">Enquire about ${o.name.toLowerCase()}</a>${o.more?`<a class="btn" href="#${o.more[1]}">${o.more[0]}</a>`:""}</div></div>${ph(o.photo)}</div>
${facts(o.facts)}
<section class="two"><div><h2>${o.h2}</h2>${o.body.map(p=>`<p>${p}</p>`).join("")}</div><div class="panel"><h3>${o.listTitle}</h3>${ul(o.list)}</div></section>
<section><h2>From recent ${o.name.toLowerCase()} sessions</h2><div class="grid">${o.shots.map(s=>ph(s,"sq")).join("")}</div></section>
${cta()}`}

function galleryPage(id,name,shots,intro){return `${crumb(["Gallery","gallery"],[name])}
<section><span class="eyebrow">Gallery</span><h1>${name}</h1><p class="lede">${intro}</p></section>
<div class="grid">${shots.map((s,i)=>ph(s,i%3==0?"":"sq")).join("")}</div>

<section><h2>Other galleries</h2><div class="btns">${[["Newborn","gallery-newborn"],["Maternity","gallery-maternity"],["Cake smash","gallery-cake-smash"],["Family &amp; sitter","gallery-family"]].filter(g=>g[1]!==id).map(g=>`<a class="btn" href="#${g[1]}">${g[0]}</a>`).join("")}</div></section>
${cta()}`}

function areaPage(id,suburb,drive,extra){return `${crumb(["Areas we serve","areas"],[suburb])}
<div class="hero"><div><span class="eyebrow">Serving ${suburb}</span><h1>Newborn &amp; family photography for ${suburb} families</h1><p class="lede">Little Sugar Tot works with families from ${suburb} and across Melbourne's south-east. ${extra}</p><div class="btns"><a class="btn fill" href="#contact">Check dates</a><a class="btn" href="#pricing">See pricing</a></div></div>${ph("Family portrait, "+suburb+" client")}</div>
<section class="two"><div><h2>Sessions for ${suburb} families</h2><p>Every session type is open to ${suburb} families: newborn, maternity, sitter milestone, cake smash and family portraits. ${drive}</p><p>When you enquire, mention you're in ${suburb} and Kay will confirm the session location and any travel details with your booking.</p></div><div class="panel"><h3>Popular with local parents</h3>${ul(["<a href='#newborn'>Newborn sessions</a> from $449","<a href='#cake-smash'>Cake smash</a> at $499 with 15 edited images","<a href='#maternity'>Maternity</a> from around 30–34 weeks","<a href='#family'>Family portraits</a> for every stage"])}</div></section>
<section><h2>Other areas</h2><div class="btns">${[["Cranbourne North","cranbourne-north"],["Cranbourne South","cranbourne-south"],["Pakenham","pakenham"]].filter(a=>a[1]!==id).map(a=>`<a class="btn" href="#${a[1]}">${a[0]}</a>`).join("")}</div></section>
${cta()}`}

const PAGES={
home:{t:"Home",g:"Studio",r:()=>`
${ph("Cover image: newborn asleep in a floral crown","cover")}
<section class="intro"><span class="eyebrow">Maternity · Newborn · Kids · Family · Cake smash</span><h1>Timeless, elegant portraits of your <em>littlest</em> moments</h1><p class="lede">Little Sugar Tot Photography is a Cranbourne North studio run by Kay, a single mum who has been photographing bumps, babies and families since 2018.</p><div class="btns"><a class="btn fill" href="#contact">Book your session</a><a class="btn" href="#gallery">View the gallery</a></div></section>
<div class="stats"><span><b>2018</b>photographing since</span><span><b>11K</b>Facebook followers</span><span><b>5K+</b>on Instagram</span></div>
<section class="intro"><span class="eyebrow">Sessions</span><h2>Every stage, beautifully kept</h2></section>
${svcGrid()}
<p class="quote">Just another mum following her passion.</p>
<section class="two"><div>${ph("Kay holding a newborn in the studio")}</div><div><span class="eyebrow">Meet Kay</span><h2>Behind the lens</h2><p>Kay is a mum first, which is why her sessions move at your baby's pace. She plans the styling, runs the session and edits every image herself from her studio in Cranbourne North.</p><p>Her style is soft and natural: creamy whites, florals and gentle light that will still look right in twenty years.</p><div class="btns"><a class="btn" href="#about">More about Kay</a></div></div></section>
<section class="intro"><span class="eyebrow">Plan ahead</span><h2>Expecting? Book your newborn session early</h2><p class="lede">Get in touch during your pregnancy. Kay holds your due-date window and confirms the exact day once your baby arrives, usually within the first two weeks.</p><div class="btns"><a class="btn" href="#prepare-newborn">Newborn session guide</a><a class="btn" href="#newborn-safety">Newborn safety</a></div></section>
${cta()}`},

about:{t:"About Kay",g:"Studio",r:()=>`${crumb(["About Kay"])}
<div class="hero"><div><span class="eyebrow">About</span><h1>Hi, I'm <em>Kay</em>.</h1><p class="lede">Mum, photographer, and the one-woman team behind Little Sugar Tot Photography in Cranbourne North.</p></div>${ph("Portrait of Kay with her baby")}</div>
<section class="two"><div><h2>A mum with a camera</h2><p>I started Little Sugar Tot in 2018 because I know how fast the baby days go. I'm a single mum, and my little one is the reason I understand what you're feeling when you walk into my studio with a brand-new baby.</p><p>My work is timeless and elegant: soft whites, florals and natural tones, so your photos sit just as well on the wall in twenty years as they do today.</p></div><div class="panel"><h3>What you can expect</h3>${ul(["One photographer from first message to final gallery","Styling, wraps, outfits and props provided","Patience for feeds, cuddles and settling","Every image edited by me"])}</div></section>
<section class="intro"><h2>Follow along</h2><p class="lede">See my latest sessions and themed minis on Instagram <strong>@littlesugartotphotography</strong> and on Facebook at <strong>Little Sugar Tot Photography</strong>.</p></section>
${cta("Let's plan your session")}`},

sessions:{t:"All sessions",g:"Sessions",r:()=>`${crumb(["Sessions"])}
<section><span class="eyebrow">Sessions</span><h1>Choose your session</h1><p class="lede">Six session types follow your family through the first years. Most families come back for more than one.</p></section>
${svcGrid()}
<section><h2>A typical first year with Little Sugar Tot</h2><div class="table-wrap"><table><thead><tr><th>Stage</th><th>Usual timing</th><th>Session</th></tr></thead><tbody>
<tr><td>Bump</td><td class="n">30–34 weeks</td><td><a href="#maternity">Maternity</a></td></tr>
<tr><td>Newborn</td><td class="n">5–14 days</td><td><a href="#newborn">Newborn</a></td></tr>
<tr><td>Sitting up</td><td class="n">6–9 months</td><td><a href="#sitter">Sitter milestone</a></td></tr>
<tr><td>First birthday</td><td class="n">11–13 months</td><td><a href="#cake-smash">Cake smash</a></td></tr>
<tr><td>Anytime</td><td class="n">Any age</td><td><a href="#family">Family</a></td></tr></tbody></table></div>
<p class="note">Timings are a guide. Every baby develops at their own pace.</p></section>
${cta()}`},

newborn:{t:"Newborn",g:"Sessions",r:()=>servicePage({name:"Newborn",eyebrow:"Newborn sessions · from $449",title:"Styled newborn portraits in the first sleepy weeks",lede:"Wraps, soft textures and simple sets, photographed while your baby is still curled and settled.",photo:"Sleeping newborn in a knitted bonnet",more:["Newborn packages","newborn-packages"],

const ORDER=Object.keys(PAGES);
const GROUPS={};ORDER.forEach(k=>{(GROUPS[PAGES[k].g]=GROUPS[PAGES[k].g]||[]).push(k)});
document.getElementById("footIndex").innerHTML=Object.entries(GROUPS).map(([g,ks])=>`<div><h4>${g}</h4><ul>${ks.map(k=>`<li><a href="#${k}">${PAGES[k].t}</a></li>`).join("")}</ul></div>`).join("");

const app=document.getElementById("app"),nav=document.getElementById("mainNav"),mb=document.getElementById("menuBtn");
function render(){const id=(location.hash||"#home").slice(1);const p=PAGES[id]||PAGES.home;tileN=0;app.innerHTML=p.r();
document.title=(id==="home"||!PAGES[id])?"Little Sugar Tot Photography":p.t+" · Little Sugar Tot";
nav.querySelectorAll("a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+id));
nav.classList.remove("open");mb.setAttribute("aria-expanded","false");window.scrollTo(0,0);bind()}
function copy(text,btn){const done=()=>{const o=btn.textContent;btn.textContent="Copied";setTimeout(()=>btn.textContent=o,1500)};
try{navigator.clipboard.writeText(text).then(done).catch(()=>sel(btn))}catch(e){sel(btn)}}
function sel(btn){const el=btn.previousElementSibling;if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function bind(){app.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copy(b.dataset.copy,b));
const f=document.getElementById("enq");if(!f)return;
f.onsubmit=e=>{e.preventDefault();const v=id=>document.getElementById(id).value.trim();
const msg=`Hi Kay,\n\nI'd like to enquire about a ${v("fSession").toLowerCase()} session.\nName: ${v("fName")||"-"}\nPhone: ${v("fPhone")||"-"}\nDue date / birthday: ${v("fDate")||"-"}\nSuburb: ${v("fSuburb")||"-"}\n\n${v("fMsg")}`;
document.getElementById("formResult").textContent=msg;document.getElementById("formOut").hidden=false;
document.getElementById("copyEnq").onclick=function(){try{navigator.clipboard.writeText(msg).then(()=>this.textContent="Copied").catch(()=>{})}catch(e){}}}}
mb.onclick=()=>{const o=nav.classList.toggle("open");mb.setAttribute("aria-expanded",o)};
addEventListener("hashchange",render);render();
</script>
